services:
  cet-word-master:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      TRUST_PROXY: "0"
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置 SESSION_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      DATA_DIR: /app/data
    volumes:
      - cet-word-data:/app/data
    restart: unless-stopped

volumes:
  cet-word-data:
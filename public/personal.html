<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人数据 - CET 学习站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="effects.css" />
  </head>
  <body>
    <div class="bg-shape shape-a"></div>
    <div class="bg-shape shape-b"></div>

    <main class="container">
      <header class="hero">
        <div class="top-row">
          <div>
            <p class="badge">Profile</p>
            <h1>个人学习数据</h1>
            <p>坚持打卡，追踪你的学习轨迹。</p>
          </div>
          <div class="account-box">
            <p id="user-info" class="muted">校验中...</p>
            <div class="account-actions">
              <a class="link-btn" href="/index.html">返回学习页</a>
              <a class="link-btn" href="/grammar.html">语法</a>
              <a class="link-btn" href="/vocab.html">词汇表</a>
              <a id="admin-link" class="link-btn hidden" href="/admin.html">后台管理</a>
              <button id="logout-btn" class="secondary">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <section id="loading-panel" class="panel">
        <p class="hint">加载中...</p>
      </section>

      <section id="deny-panel" class="panel hidden">
        <h2>请先登录</h2>
        <p class="hint">正在跳转至登录页...</p>
      </section>

      <section id="stats-panel" class="hidden">

        <!-- Badge & Streak -->
        <section class="panel">
          <div class="stats-cards" id="stats-cards"></div>
        </section>

        <!-- Weekly heatmap -->
        <section class="panel">
          <div class="section-title-row">
            <h2>近7天学习趋势</h2>
          </div>
          <div id="weekly-chart" class="weekly-chart"></div>
        </section>

        <!-- Word stats -->
        <section class="panel">
          <div class="section-title-row">
            <h2>单词统计</h2>
          </div>
          <div id="word-stats-detail" class="stats-detail"></div>
        </section>

        <!-- Dictation stats -->
        <section class="panel">
          <div class="section-title-row">
            <h2>默写统计</h2>
          </div>
          <div id="dictation-stats-detail" class="stats-detail"></div>
        </section>

        <!-- Weak words -->
        <section class="panel">
          <div class="section-title-row">
            <h2>薄弱词复习</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>等级</th>
                  <th>单词</th>
                  <th>音标</th>
                  <th>释义</th>
                  <th>已记次数</th>
                </tr>
              </thead>
              <tbody id="weak-words-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="effects.js"></script>
    <script src="personal.js"></script>
  </body>
</html>

      </div>
      <div class="doodle doodle-boat doodle-pos-lm">

              <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="83" result="n" />

            </filter>
            <filter id="btJit2" x="-12%" y="-14%" width="124%" height="128%">
              <feTurbulence type="fractalNoise" baseFrequency="0.036" numOctaves="2" seed="97" result="n" />

            </filter>
            <filter id="btGrain" x="0" y="0" width="100%" height="100%">

    <main class="container">
      <header class="masthead">
        <div class="masthead-meta">
          <span class="kicker">CET WORD MASTER</span>
          <span class="dateline">EST. 2026 · 数据档案</span>
        </div>
        <div class="masthead-main">
          <div class="masthead-title">
            <p class="badge" data-animate style="--stagger:0">Profile</p>
            <h1 data-animate style="--stagger:1">个人学习数据</h1>
            <svg class="doodle-underline" viewBox="0 0 224 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9 q11 -7 22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t21 0" /></svg>
            <p class="dek" data-animate style="--stagger:2"><em>Your record, day by day.</em> 坚持打卡，追踪你的学习轨迹。</p>
          </div>
          <div class="account-box" data-animate style="--stagger:3">
            <p id="user-info" class="muted">校验中...</p>
            <div class="account-actions">
              <a class="link-btn" href="/index.html">返回学习页</a>
              <a class="link-btn" href="/grammar.html">语法</a>
              <a class="link-btn" href="/vocab.html">词汇表</a>
              <a id="admin-link" class="link-btn hidden" href="/admin.html">后台管理</a>
              <button id="logout-btn" class="secondary">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <section id="loading-panel" class="panel">
        <p class="hint">加载中...</p>
      </section>

      <section id="deny-panel" class="panel hidden">
        <h2>请先登录</h2>
        <p class="hint">正在跳转至登录页...</p>
      </section>

      <section id="stats-panel" class="hidden">

        <!-- Badge & Streak -->
        <section class="panel">
          <div class="stats-cards" id="stats-cards"></div>
        </section>

        <!-- Weekly heatmap -->
        <section class="panel">
          <span class="doodle-tape" aria-hidden="true"></span>
          <div class="section-title-row">
            <h2>近7天学习趋势</h2>
          </div>
          <div id="weekly-chart" class="weekly-chart"></div>
        </section>

        <!-- Word stats -->
        <section class="panel">
          <div class="section-title-row">
            <h2>单词统计<svg class="doodle-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 L14.1 9.1 L20.2 9.6 L15.6 13.6 L17.1 19.8 L12 16.4 L6.9 19.8 L8.4 13.6 L3.8 9.6 L9.9 9.1 Z" /></svg></h2>
          </div>
          <div id="word-stats-detail" class="stats-detail"></div>
        </section>

        <!-- Dictation stats -->
        <section class="panel">
          <div class="section-title-row">
            <h2>默写统计</h2>
          </div>
          <div id="dictation-stats-detail" class="stats-detail"></div>
        </section>

        <!-- Weak words -->
        <section class="panel">
          <div class="section-title-row">
            <h2>薄弱词复习</h2>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>等级</th>
                  <th>单词</th>
                  <th>音标</th>
                  <th>释义</th>
                  <th>已记次数</th>
                </tr>
              </thead>
              <tbody id="weak-words-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="personal.js"></script>
  </body>
</html>

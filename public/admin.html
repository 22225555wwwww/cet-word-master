        <h2>无权限访问</h2>
        <p class="hint">你不是管理员，无法进入后台。</p>
      </section>

      <section id="admin-panels" class="hidden">
        <section class="panel">
          <span class="doodle-tape" aria-hidden="true"></span>
          <div class="section-title-row">
            <h2>系统概览</h2>
            <button id="refresh-overview" class="secondary">刷新</button>
          </div>
          <div id="overview-stats" class="stats"></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>热门单词</th>
                  <th>等级</th>
                  <th>总记忆次数</th>
                </tr>
              </thead>
              <tbody id="hot-words-body"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="section-title-row">
            <h2>用户管理</h2>
            <button id="refresh-users" class="secondary">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>用户名</th>
                  <th>角色</th>
                  <th>已背单词</th>
                  <th>总记忆次数</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="section-title-row">
            <h2>词库管理<svg class="doodle-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke-width="2.4" d="M4 13 q4.5 4 6 6 q4.5 -8.5 10.5 -13.5" /></svg></h2>
            <div class="inline-actions">
              <select id="filter-level">
                <option value="ALL">全部</option>
                <option value="CET4">仅四级</option>
                <option value="CET6">仅六级</option>
              </select>
              <button id="refresh-words" class="secondary">刷新</button>
              <button id="import-cet4" class="secondary" title="从 data/CET4_full.txt 导入完整四级词库（会重置四级高频词标记）">导入四级词库</button>
              <button id="import-cet6" class="secondary" title="从 data/CET6_full.txt 导入完整六级词库（会重置六级高频词标记）">导入六级词库</button>
            </div>
          </div>

          <form id="add-word-form" class="grid-form">
            <label>
              等级
              <select name="level" required>
                <option value="CET4">CET-4</option>
                <option value="CET6">CET-6</option>
              </select>
            </label>
            <label>
              单词
              <input name="word" required maxlength="50" />
            </label>
            <label>
              音标
              <input name="phonetic" maxlength="100" />
            </label>
            <label>
              释义
              <input name="meaning" required maxlength="200" />
            </label>
            <button class="primary" type="submit">新增单词</button>
          </form>

          <p id="words-msg" class="hint"></p>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>等级</th>
                  <th>单词</th>
                  <th>音标</th>
                  <th>释义</th>
                  <th>创建时间</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="words-body"></tbody>
            </table>
          </div>

          <div class="inline-actions" style="justify-content:center;margin-top:14px;">
            <button id="words-prev" class="secondary small-btn">上一页</button>
            <span id="words-page-info" class="hint" style="margin:0 14px;"></span>
            <button id="words-next" class="secondary small-btn">下一页</button>
          </div>
        </section>

        <section class="panel">
          <div class="section-title-row">
            <h2>语法管理</h2>
            <button id="refresh-grammar" class="secondary">刷新</button>
          </div>

          <form id="add-grammar-form" class="grid-form">
            <label>
              分类
              <input name="category" required maxlength="30" placeholder="如: 时态" />
            </label>
            <label>
              标题
              <input name="title" required maxlength="100" placeholder="如: 一般现在时" />
            </label>
            <label>
              句型结构
              <input name="pattern" maxlength="200" placeholder="如: 主语 + V原/V-s/es" />
            </label>
            <label>
              详细解释
              <input name="explanation" required maxlength="2000" placeholder="语法解释..." />
            </label>
            <button class="primary" type="submit">新增语法点</button>
          </form>

          <p id="grammar-msg" class="hint"></p>

          <div id="grammar-points-list"></div>
        </section>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="admin.js"></script>
  </body>
</html>

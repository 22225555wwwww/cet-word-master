<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四六级词汇表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="effects.css" />
  </head>
  <body>
    <div class="bg-shape shape-a"></div>
    <div class="bg-shape shape-b"></div>

    <main class="container">
      <header class="hero">
        <div class="top-row">
          <div>
            <p class="badge">CET Vocab</p>
            <h1>四六级词汇表</h1>
            <p>按等级查看全量词汇，支持分页浏览与记忆统计。</p>
          </div>
          <div class="account-box">
            <p id="user-info" class="muted">未登录</p>
            <div class="account-actions">
              <a class="link-btn" href="/index.html">返回学习页</a>
              <a class="link-btn" href="/grammar.html">语法</a>
              <a class="link-btn" href="/personal.html">个人数据</a>
              <a id="admin-link" class="link-btn hidden" href="/admin.html">后台管理</a>
              <button id="logout-btn" class="secondary">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <section class="panel" aria-label="等级选择">
        <div class="segment" role="tablist" aria-label="四六级切换" id="vocab-level-segment">
          <div class="slider" id="vocab-level-slider"></div>
          <button id="level-cet4" class="segment-btn active" role="tab" aria-selected="true">四级（CET-4）</button>
          <button id="level-cet6" class="segment-btn" role="tab" aria-selected="false">六级（CET-6）</button>
        </div>
      </section>

      <section class="panel" aria-label="词汇表">
        <div class="section-title-row">
          <h2>词汇列表</h2>
          <p id="vocab-stats" class="muted"></p>
        </div>

        <div class="search-row">
          <div class="search-input-wrap">
            <input
              id="search-input"
              type="text"
              placeholder="输入中文或英文搜索单词..."
              autocomplete="off"
            />
            <button id="search-clear" class="search-clear-btn hidden" type="button" aria-label="清除搜索">&times;</button>
          </div>
        </div>

        <div class="table-controls">
          <label class="inline-field">
            每页
            <select id="page-size">
              <option value="20">20</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
            个
          </label>
          <button id="refresh-counts" class="secondary" type="button">刷新计数</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>等级</th>
                <th>单词</th>
                <th>音标</th>
                <th>释义</th>
                <th>记住次数</th>
                <th>成功默写次数</th>
              </tr>
            </thead>
            <tbody id="vocab-body"></tbody>
          </table>
        </div>

        <div class="pager">
          <button id="page-first" class="secondary" type="button">首页</button>
          <button id="page-prev" class="secondary" type="button">上一页</button>
          <span id="page-info" class="pager-info"></span>
          <button id="page-next" class="secondary" type="button">下一页</button>
          <button id="page-last" class="secondary" type="button">末页</button>
        </div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="effects.js"></script>
    <script src="vocab.js"></script>
  </body>
</html>

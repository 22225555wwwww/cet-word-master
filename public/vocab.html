            <g stroke="rgba(25,25,20,0.38)" stroke-width="1.05">
              <path d="M36.5 40.5 l5.2 -6" />
              <path d="M41.5 37.5 l5.2 -6" />
              <path d="M31.5 43 l5.2 -6" />

            <path stroke-width="1.3" stroke="rgba(25,25,20,0.43)" d="M14.5 55.5 q15.5 6.5 31 0" />

              <path d="M19 59.5 l6 -4.2" />
              <path d="M28 61 l6 -4.2" />

      </div>
    </div>

    <main class="container">
      <header class="masthead">
        <div class="masthead-meta">
          <span class="kicker">CET WORD MASTER</span>
          <span class="dateline">EST. 2026 · 词汇档案</span>
        </div>
        <div class="masthead-main">
          <div class="masthead-title">
            <p class="badge" data-animate style="--stagger:0">CET Vocab</p>
            <h1 data-animate style="--stagger:1">四六级词汇表</h1>
            <svg class="doodle-underline" viewBox="0 0 224 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 9 q11 -7 22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t22 0 t21 0" /></svg>
            <p class="dek" data-animate style="--stagger:2"><em>The full word list.</em> 按等级查看全量词汇，支持分页浏览与记忆统计。</p>
          </div>
          <div class="account-box" data-animate style="--stagger:3">
            <p id="user-info" class="muted">未登录</p>
            <div class="account-actions">
              <a class="link-btn" href="/index.html">返回学习页</a>
              <a class="link-btn" href="/grammar.html">语法</a>
              <a class="link-btn" href="/personal.html">个人数据</a>
              <a id="admin-link" class="link-btn hidden" href="/admin.html">后台管理</a>
              <button id="logout-btn" class="secondary">退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <section class="panel" aria-label="等级选择">
        <div class="segment" role="tablist" aria-label="四六级切换" id="vocab-level-segment">
          <div class="slider" id="vocab-level-slider"></div>
          <button id="level-cet4" class="segment-btn active" role="tab" aria-selected="true">四级（CET-4）</button>
          <button id="level-cet6" class="segment-btn" role="tab" aria-selected="false">六级（CET-6）</button>
        </div>
      </section>

      <section class="panel" aria-label="词汇表">
        <span class="doodle-tape" aria-hidden="true"></span>
        <div class="section-title-row">
          <h2>词汇列表<svg class="doodle-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke-width="2.4" d="M4 13 q4.5 4 6 6 q4.5 -8.5 10.5 -13.5" /></svg></h2>
          <p id="vocab-stats" class="muted"></p>
        </div>

        <div class="search-row">
          <div class="search-input-wrap">
            <input
              id="search-input"
              type="text"
              placeholder="输入中文或英文搜索单词..."
              autocomplete="off"
            />
            <button id="search-clear" class="search-clear-btn hidden" type="button" aria-label="清除搜索">&times;</button>
          </div>
        </div>

        <div class="table-controls">
          <label class="inline-field">
            每页
            <select id="page-size">
              <option value="20">20</option>
              <option value="50" selected>50</option>
              <option value="100">100</option>
            </select>
            个
          </label>
          <button id="refresh-counts" class="secondary" type="button">刷新计数</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>等级</th>
                <th>单词</th>
                <th>音标</th>
                <th>释义</th>
                <th>记住次数</th>
                <th>成功默写次数</th>
              </tr>
            </thead>
            <tbody id="vocab-body"></tbody>
          </table>
        </div>

        <div class="pager">
          <button id="page-first" class="secondary" type="button">首页</button>
          <button id="page-prev" class="secondary" type="button">上一页</button>
          <span id="page-info" class="pager-info"></span>
          <button id="page-next" class="secondary" type="button">下一页</button>
          <button id="page-last" class="secondary" type="button">末页</button>
        </div>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="vocab.js"></script>
  </body>
</html>

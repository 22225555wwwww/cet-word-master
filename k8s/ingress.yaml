apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cet-word-master
  namespace: cet-word
  labels:
    app.kubernetes.io/name: cet-word-master
  annotations:
    # 会话 Cookie 在生产环境要求 secure，建议 Ingress 层终止 TLS
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: cet-word.example.com # 改成你的域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cet-word-master
                port:
                  name: http
  # tls:
  #   - hosts:
  #       - cet-word.example.com
  #     secretName: cet-word-tls